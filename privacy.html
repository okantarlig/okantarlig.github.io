    <style>
      :root {
        --bg: #060913;
        --bg-soft: #0f1424;
        --card: #141b2e;
        --card-2: #1a2239;
        --text: #f2f4ff;
        --muted: #a9b1cf;
        --line: #2b3556;
        --primary: #6f7fff;
        --accent: #31d0a7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #1b2450 0%, transparent 45%),
          radial-gradient(1000px 700px at 100% 0%, #1f1a42 0%, transparent 40%), var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      }

      [dir="rtl"] body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      a {
        color: #8ea2ff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 52px;
      }

      .topbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
      }

      .lang-switch {
        display: inline-flex;
        gap: 6px;
        background: #11182b;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px;
      }

      .lang-btn {
        border: 1px solid transparent;
        background: transparent;
        color: #d7ddf7;
        border-radius: 999px;
        font-size: 13px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .lang-btn[aria-pressed="true"] {
        background: #202d54;
        border-color: #344685;
        color: #ffffff;
      }

      .hero {
        border: 1px solid var(--line);
        background: linear-gradient(160deg, #10172a 0%, #0c1120 100%);
        border-radius: 18px;
        padding: 18px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
      }

      .logo-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #0b1020;
        border: 1px solid var(--line);
        object-fit: cover;
      }

      .logo-text {
        width: min(320px, 100%);
        height: auto;
        display: block;
      }

      .fallback-title {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }

      .chips {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        font-size: 12px;
        color: #d6dcff;
        border: 1px solid var(--line);
        background: #0f1528;
        padding: 7px 10px;
        border-radius: 999px;
      }

      .grid {
        margin-top: 14px;
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        border: 1px solid var(--line);
        background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
        border-radius: 16px;
        padding: 16px;
      }

      .card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .kv {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px;
        font-size: 14px;
      }

      [dir="rtl"] .kv {
        grid-template-columns: 1fr 150px;
      }

      .kv div:nth-child(odd) {
        color: var(--muted);
      }

      .cta {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #31407b;
        background: #1a2550;
        color: #eef1ff;
        font-weight: 600;
      }

      .cta-secondary {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid #4a5687;
        background: #121a31;
        color: #dce3ff;
        font-weight: 600;
      }

      .policy {
        margin-top: 14px;
      }

      .policy h2 {
        margin: 0;
        font-size: 24px;
      }

      .lead {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .section {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #101728;
        padding: 14px;
      }

      .section h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .section p,
      .section ul {
        margin: 0;
        color: #cbd2eb;
        line-height: 1.6;
        font-size: 14px;
      }

      .section ul {
        padding-left: 18px;
      }

      [dir="rtl"] .section ul {
        padding-left: 0;
        padding-right: 18px;
      }

      .badge {
        display: inline-block;
        margin-top: 10px;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #275f51;
        color: #b9f7e5;
        background: #102822;
      }

      .footer {
        margin-top: 16px;
        color: #8f98bd;
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .kv {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
    </style>
  </head>

      function applyLanguage(lang) {
        const dict = i18n[lang] || i18n.en;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });

        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
        });

        const pageTitles = {
          en: "Viona Player - Privacy Policy",
          tr: "Viona Player - Gizlilik Politikasi",
          de: "Viona Player - Datenschutzrichtlinie",
          ar: "Viona Player - سياسة الخصوصية"
        };
        document.title = pageTitles[lang] || pageTitles.en;
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
      });

      // Default language at first open: English
      applyLanguage("en");
    </script>
